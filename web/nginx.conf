# Single production origin for the SwitchYard console: serves the built SPA and
# reverse-proxies the two gateway ports so the app's same-origin /v1 and /admin
# calls work unchanged from dev.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any unknown path resolves to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /v1/chat/completions streams SSE. Buffering it here would defeat the
    # gateway's per-chunk flush — the same "streaming stays streaming" rule.
    location /v1/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /admin/ {
        proxy_pass http://gateway:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Sign-in must come through this origin so the session cookies are
    # first-party to the console; the gateway's admin port is not public.
    location /auth/ {
        proxy_pass http://gateway:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
