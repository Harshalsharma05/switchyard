# Team config for scripts/loadtest.js. Three teams, each exercising a
# different limit on purpose:
#   team-realtime      generous limits — the steady, mostly-200 baseline
#   team-batch         RPM/TPM sized to be blown through in seconds, so the
#                      run produces real 429s under real concurrency
#   team-budget-capped a monthly cap sized to exhaust after a few dozen
#                      requests, so the run produces real 402s
#
# Dev keys (plaintext, never committed elsewhere): sk-loadtest-realtime-9f2b1c,
# sk-loadtest-batch-7a4e0d, sk-loadtest-budgetcapped-3c1d8f.

