# Provider config for scripts/loadtest.js — mock providers for the priced
# request traffic (never a real API, so the run can throw 5,000+ requests
# without spending provider money), plus one real Groq entry used only as the
# Phase 9 quality judge. Kept out of configs/ so it never gets mistaken for
# the dev/demo registry.

providers:
  - name: mock-primary
    type: openai-compatible
    enabled: true
    base_url: http://127.0.0.1:9501
    api_key_env: SWITCHYARD_LOADTEST_KEY
    timeout: 5s
    default_max_tokens: 64
    ping_model: mock-fast
    models:
      - name: mock-fast
        input_per_1m_usd: 0.50
        output_per_1m_usd: 1.50
      - name: mock-frontier
        input_per_1m_usd: 2.00
        output_per_1m_usd: 6.00

  - name: mock-fallback
    type: openai-compatible
    enabled: true
    base_url: http://127.0.0.1:9502
    api_key_env: SWITCHYARD_LOADTEST_KEY
    timeout: 5s
    default_max_tokens: 64
    ping_model: mock-fast-b
    models:
      - name: mock-fast-b
        input_per_1m_usd: 0.50
        output_per_1m_usd: 1.50
      - name: mock-frontier-b
        input_per_1m_usd: 2.00
        output_per_1m_usd: 6.00

  # Real provider, used only as the quality judge (configs/loadtest/quality.yaml).
  # Deliberately absent from every tier below, so priced load traffic never
  # reaches it — only the async worker calls this model.
  - name: groq
    type: openai-compatible
    enabled: true
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    timeout: 30s
    default_max_tokens: 1024
    ping_model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        input_per_1m_usd: 0.075
        output_per_1m_usd: 0.30

# fast is the cheap tier (routing's `simple` target); frontier is the costly
# tier (`complex` target and the fallback chain for mock-frontier). Both stay
# mock-only.
tiers:
  fast:
    - { provider: mock-primary, model: mock-fast }
    - { provider: mock-fallback, model: mock-fast-b }
  frontier:
    - { provider: mock-primary, model: mock-frontier }
    - { provider: mock-fallback, model: mock-frontier-b }
