# SwitchYard local dev/deploy stack.
#
# Filled in incrementally, one phase at a time — Redis (Phase 3), Jaeger
# (Phase 8), Prometheus (Phase 9), Grafana (Phase 10) now.
# `docker compose up` is meant to bring up everything by the end of Part 1;
# until then, bring up only what the current phase needs.

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # AOF persistence: rate-limit and budget state surviving a container
    # restart matters more here than the extra disk I/O costs during dev.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local collector + UI for Phase 8's traces. The gateway ships spans over
  # OTLP/HTTP (SWITCHYARD_OTLP_ENDPOINT defaults to localhost:4318, or this
  # service's name on the compose network), never gRPC — see DECISIONS.md
  # for why. all-in-one bundles the collector, storage, and query UI in one
  # container, which is the right trade for local dev; it is not what a real
  # deployment would run.
  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686" # web UI
      - "4318:4318"   # OTLP/HTTP receiver
    environment:
      # Older all-in-one builds keep the OTLP receiver off unless told;
      # harmless to set on newer ones where it's already the default.
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      # No curl in this image, but it does ship wget. :14269 is the
      # all-in-one's own admin port; / answers 200 once it's actually
      # serving, not just once the process has started.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Same story as jaeger: no curl, but wget is there. Prometheus's own
      # /-/healthy is the documented liveness endpoint.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The gateway itself, containerized (Step 11.4's last checklist item: a
  # fresh clone plus `docker compose up` should be the whole story). Builds
  # from the repo-root Dockerfile rather than a pulled image — there is
  # nowhere else this image comes from yet.
  #
  # depends_on with condition: service_healthy, not the plain form: a
  # plain depends_on only waits for a container to *start*, and this
  # gateway dials Redis and ships OTLP spans from its very first request —
  # starting before those are actually ready to answer would just move the
  # "is my dependency up yet" race from Compose into the gateway's own
  # fail-open/fail-closed logic, which exists for production degradation,
  # not for masking a slow local boot order.
  #
  # SWITCHYARD_REDIS_ADDR and SWITCHYARD_OTLP_ENDPOINT still default to
  # localhost at this point in the diff — Step 3 is the localhost ->
  # service-name rewrite, on purpose kept separate so it can be reviewed
  # on its own. Ollama is not a Compose service (it runs natively on the
  # host); its address is handled below.
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    # configs/ is bind-mounted, not baked in only, so editing
    # configs/providers.yaml or configs/teams.yaml on the host and calling
    # POST /admin/reload works the same way it does outside Docker —
    # Step 4.4's hot reload shouldn't behave differently just because the
    # process is containerized.
    volumes:
      - ../configs:/app/configs:ro
      # Ollama's base_url is a literal field in configs/providers.yaml, not
      # an env var, and that file is shared with host-run dev, the load
      # test, and demo.sh — none of which want the container-side address.
      # This mounts a second, compose-only copy and points
      # SWITCHYARD_PROVIDERS_CONFIG at it instead, so the shared file never
      # changes. Deliberately mounted as a sibling of /app/configs, not
      # nested inside it: Docker can't create a mountpoint for a second
      # bind mount inside a directory that's already bind-mounted
      # read-only (confirmed the hard way — nesting it under /app/configs/
      # fails at container start with "read-only file system"). Must be
      # kept in sync with configs/providers.yaml by hand if Groq/Gemini
      # pricing or models ever change there.
      - ./providers.yaml:/app/providers.compose.yaml:ro
    env_file:
      - ../.env
    environment:
      - SWITCHYARD_REDIS_ADDR=redis:6379
      - SWITCHYARD_OTLP_ENDPOINT=jaeger:4318
      - SWITCHYARD_PROVIDERS_CONFIG=/app/providers.compose.yaml
    # Ollama runs natively on the host, not as a Compose service — this is
    # what lets the container reach it at host.docker.internal regardless.
    # Docker Desktop (Windows/Mac) resolves that hostname on its own;
    # Linux needs this explicit mapping, same reasoning as prometheus's
    # own extra_hosts entry above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      # The gateway starts only after the request-log schema is in place, so
      # its first write can never hit a missing table. service_completed_
      # successfully waits for the one-shot migrate container to exit 0.
      migrate:
        condition: service_completed_successfully

  # Request-log persistence (Part 2, Phase 1). Postgres 16, named volume so
  # rows survive a container restart. POSTGRES_PASSWORD comes from ../.env
  # via env_file — same pattern as the provider API keys (GROQ_API_KEY,
  # GEMINI_API_KEY): a third-party credential under its native name, never
  # in this file. POSTGRES_USER / POSTGRES_DB are not secrets, so they sit
  # here as literals. The healthcheck exists so the gateway's depends_on
  # (wired in Phase 1) can wait on a database that actually answers, not
  # just a container that has started.
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=switchyard
      - POSTGRES_DB=switchyard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot request-log schema migration (Part 2, Phase 1). Runs to
  # completion and exits; the gateway's depends_on waits on that exit rather
  # than doing migrations to itself on boot — a clean separation between
  # "bring the schema up" and "serve traffic". Built from the same repo-root
  # Dockerfile as the gateway, overriding the entrypoint to the migrate
  # binary. Connection settings mirror the gateway's: POSTGRES_PASSWORD from
  # env_file, host pointed at the compose service.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    # Override the image's ENTRYPOINT (the gateway) with the migrate binary
    # baked into the same image.
    entrypoint: ["/app/migrate"]
    env_file:
      - ../.env
    environment:
      - SWITCHYARD_POSTGRES_HOST=postgres:5432
    depends_on:
      postgres:
        condition: service_healthy

  # Dashboards + alerting for Phase 9's metrics, file-provisioned on boot.
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Placeholder default so a missing webhook never blocks provisioning;
      # see .env.example for how to set a real one.
      - SWITCHYARD_SLACK_WEBHOOK_URL=${SWITCHYARD_SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/PLACEHOLDER}
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  postgres-data:
