# SwitchYard provider registry.
#
# `name` is the instance — free-form, and what appears in metrics labels,
# response headers, and errors. `type` selects the Go adapter. Keeping them
# separate is what lets a free stand-in occupy a slot during development and be
# swapped for the real provider by editing this file alone.
#
# Prices are US dollars per 1,000,000 tokens. They are converted to integer
# micro-dollars once at load; all accumulation downstream is integer arithmetic.
#
# VERIFY BEFORE RELYING ON THESE NUMBERS. Provider pricing changes without
# notice, and Phase 4's cost accounting is only as accurate as this file.

providers:
  # --- OpenAI slot -----------------------------------------------------------
  # Groq speaks OpenAI's dialect, so it reuses the same adapter unchanged.
  # Swapping in real OpenAI means enabling the entry below, not writing code.
  - name: groq
    type: openai-compatible
    enabled: true
    base_url: https://api.groq.com/openai/v1
    # base_url: http://127.0.0.1:9/v1
    api_key_env: GROQ_API_KEY
    timeout: 30s
    default_max_tokens: 1024
    ping_model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-120b
        input_per_1m_usd: 0.15
        output_per_1m_usd: 0.60
      - name: openai/gpt-oss-20b
        input_per_1m_usd: 0.075
        output_per_1m_usd: 0.30

  - name: openai
    type: openai-compatible
    enabled: false # no paid key yet; Groq occupies this slot
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 30s
    default_max_tokens: 1024
    ping_model: gpt-4o-mini
    models:
      - name: gpt-4o
        input_per_1m_usd: 2.50
        output_per_1m_usd: 10.00
      - name: gpt-4o-mini
        input_per_1m_usd: 0.15
        output_per_1m_usd: 0.60

  # --- Anthropic slot --------------------------------------------------------
  # Gemini has its own adapter. It differs from the OpenAI dialect in the same
  # places Anthropic does, which is the point of using it here.
  - name: gemini
    type: gemini
    enabled: true
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    timeout: 30s
    default_max_tokens: 1024
    ping_model: gemini-3.5-flash-lite
    models:
      - name: gemini-3.5-flash
        input_per_1m_usd: 1.50
        output_per_1m_usd: 9.00
      - name: gemini-3.5-flash-lite
        input_per_1m_usd: 0.30
        output_per_1m_usd: 2.50

  - name: anthropic
    type: anthropic
    enabled: false # no paid key yet; Gemini occupies this slot
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    timeout: 30s
    default_max_tokens: 1024
    ping_model: claude-haiku-4-5
    models:
      - name: claude-sonnet-4-5
        input_per_1m_usd: 3.00
        output_per_1m_usd: 15.00
      - name: claude-haiku-4-5
        input_per_1m_usd: 1.00
        output_per_1m_usd: 5.00

  # --- Local fallback --------------------------------------------------------
  # Runs on the machine, costs nothing, needs no credential. Last link in the
  # Phase 6 fallback chain.
  - name: ollama
    type: ollama
    enabled: true
    base_url: http://localhost:11434
    timeout: 120s # local models on CPU are slow; this is not a paid-API budget
    default_max_tokens: 1024
    ping_model: llama3.2:3b
    models:
      - name: llama3.2:3b
        input_per_1m_usd: 0.0
        output_per_1m_usd: 0.0

# --- Fallback tiers (Phase 6) 
# A tier is an ordered chain of interchangeable-enough options. A request for
# any model below resolves to that model first, then walks the rest of its own
# tier: down providers are skipped, degraded ones sink below healthy ones, and
# anything the calling team's allowlist forbids is dropped outright — even when
# it is the only option left.
#
# `provider` is redundant with `model` (a model maps to exactly one provider)
# and required anyway: it documents intent and turns a moved or misspelled model
# into a startup error instead of a chain that quietly resolves elsewhere.
#
# Entries naming a disabled provider are dropped at load, not rejected, so the
# intended chain stays documented while a paid slot is switched off. Every
# openai/anthropic line below is inert today for exactly that reason.
#
# A model may belong to at most one tier — "its tier" has to be unambiguous.
# A model in no tier simply has no fallback.

tiers:
  frontier:
    - { provider: groq, model: openai/gpt-oss-120b }
    - { provider: gemini, model: gemini-3.5-flash }
    - { provider: openai, model: gpt-4o }
    - { provider: anthropic, model: claude-sonnet-4-5 }

  fast:
    - { provider: groq, model: openai/gpt-oss-20b }
    - { provider: gemini, model: gemini-3.5-flash-lite }
    - { provider: openai, model: gpt-4o-mini }
    - { provider: anthropic, model: claude-haiku-4-5 }
    # Local, free, and last: a chain that reaches here still answers when every
    # paid provider is down.
    - { provider: ollama, model: llama3.2:3b }
